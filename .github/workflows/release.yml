name: release

# Publishing is a tag push. Everything the updater reads -- the release, its
# assets, and the checksums it verifies them against -- is produced here, so
# there is no update server and no feed file that can fall out of date.
#
# `workflow_dispatch` runs the same jobs but stops before publishing, which is
# how the packaging gets exercised without cutting a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: test-${{ matrix.os }}
      - run: cargo test --release

  macos:
    needs: test
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        # Three artifacts. The universal one is what the updater installs -- it
        # runs on either architecture -- and the per-architecture ones are
        # smaller downloads for anyone installing by hand.
        include:
          - name: arm64
            flags: --target=aarch64-apple-darwin
          - name: x86_64
            flags: --target=x86_64-apple-darwin
          - name: universal
            flags: --universal
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # Explicit rather than the action's `targets` input: this fails loudly if
      # a target cannot be installed, instead of leaving the build to discover
      # it as "can't find crate for `core`" twenty minutes later.
      - name: Cross-compile targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-${{ matrix.name }}

      # Ad-hoc signed, not notarised: the README covers the one-time
      # `xattr -dr com.apple.quarantine` that first launch needs.
      - name: Bundle and package
        run: ./tools/bundle-macos.sh --dmg ${{ matrix.flags }}

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.name }}
          path: target/release/dist/*.dmg
          if-no-files-found: error

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: target/release/dist/*.dmg
          fail_on_unmatched_files: true

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: windows

      - name: Build
        run: cargo build --release --features gui --bins

      - name: Version
        id: version
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          "value=$v" >> $env:GITHUB_OUTPUT

      # The app ships three executables and the updater replaces only the
      # running one, so a plain zip stays the honest no-installer fallback.
      - name: Zip
        shell: pwsh
        run: |
          $stage = "dist/displaymux-${{ steps.version.outputs.value }}-windows-x86_64"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item target/release/dmux.exe, target/release/dmux-gui.exe, target/release/dmux-ddc-helper.exe $stage
          Compress-Archive -Path "$stage/*" -DestinationPath "$stage.zip"

      - name: NSIS installer
        shell: pwsh
        run: |
          # The image sometimes has NSIS and sometimes does not, and the
          # Chocolatey feed answers 504 often enough to be worth retrying.
          $candidates = @(
            "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
            "$env:ProgramFiles\NSIS\makensis.exe"
          )
          $makensis = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          for ($i = 1; -not $makensis -and $i -le 3; $i++) {
            choco install nsis --no-progress -y
            $makensis = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
            if (-not $makensis) { Start-Sleep -Seconds 15 }
          }
          if (-not $makensis) {
            throw "makensis.exe not found after 3 attempts"
          }
          # makensis resolves File and OutFile against the script's directory,
          # not the working directory, so both have to be absolute.
          $out = "${{ github.workspace }}\dist\displaymux-${{ steps.version.outputs.value }}-windows-x86_64-setup.exe"
          $bin = "${{ github.workspace }}\target\release"
          & $makensis "/DVERSION=${{ steps.version.outputs.value }}" "/DBINDIR=$bin" "/DOUTFILE=$out" packaging/windows/installer.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis failed" }

      - name: MSI installer
        shell: pwsh
        run: |
          choco install wixtoolset --no-progress -y
          $wix = Get-ChildItem "${env:ProgramFiles(x86)}\WiX Toolset*" -Directory -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $wix) { throw "WiX toolset not found" }
          $wixBin = Join-Path $wix.FullName "bin"

          $version = "${{ steps.version.outputs.value }}"
          $binDir  = "${{ github.workspace }}\target\release"
          $icon    = "${{ github.workspace }}\assets\icon.ico"
          $obj     = "dist/wixobj"
          $msi     = "dist/displaymux-$version-windows-x86_64.msi"
          New-Item -ItemType Directory -Force -Path $obj | Out-Null

          # Every define is quoted. Unquoted, PowerShell hands
          # `-dVersion=0.1.0` to candle as something other than one argument,
          # and candle reads the remainder as a source file.
          $candleArgs = @(
            "-nologo"
            "-dVersion=$version"
            "-dBinDir=$binDir"
            "-dIconPath=$icon"
            "-out"
            "$obj\main.wixobj"
            "packaging/windows/main.wxs"
          )
          Write-Host "candle $($candleArgs -join ' ')"
          & (Join-Path $wixBin "candle.exe") @candleArgs
          if ($LASTEXITCODE -ne 0) { throw "candle failed" }

          $lightArgs = @("-nologo", "-out", $msi, "$obj\main.wixobj")
          Write-Host "light $($lightArgs -join ' ')"
          & (Join-Path $wixBin "light.exe") @lightArgs
          if ($LASTEXITCODE -ne 0) { throw "light failed" }

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.zip
            dist/*.msi
            dist/*-setup.exe
          if-no-files-found: error

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*.zip
            dist/*.msi
            dist/*-setup.exe
          fail_on_unmatched_files: true

  # The updater asks for SHA256SUMS and refuses a download it cannot check, so
  # this runs last, over everything that was published. Doing it in one place
  # is the only way the file can list every asset: the packaging jobs finish in
  # an order nobody controls.
  checksums:
    needs: [macos, windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate and upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          mkdir -p assets
          gh release download "$tag" --dir assets --pattern '*.dmg' --pattern '*.zip' --pattern '*.msi' --pattern '*-setup.exe'
          cd assets
          sha256sum ./* | sed 's|  \./|  |' > SHA256SUMS
          cat SHA256SUMS
          gh release upload "$tag" SHA256SUMS --clobber
