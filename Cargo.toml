[package]
name = "displaymux"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Lightweight cross-platform tool to switch a monitor's input source (DDC/CI)"
license = "MIT"
repository = "https://github.com/tsukiyo20/displaymux"
keywords = ["ddc", "ddc-ci", "monitor", "kvm", "gpui"]
categories = ["hardware-support", "gui"]

[lib]
name = "displaymux"
path = "src/lib.rs"

# Human-facing CLI. Shipped name is short even though the crate is descriptive.
[[bin]]
name = "dmux"
path = "src/bin/dmux.rs"

# One-shot, one-operation-per-process DDC helper. Never meant to be run by hand
# except for debugging; `dmux` and the GUI both spawn it.
[[bin]]
name = "dmux-ddc-helper"
path = "src/bin/dmux-ddc-helper.rs"

# GPUI desktop front end. Built separately from the CLI so that a headless or
# non-GUI build does not need the (large) GUI dependency tree.
[[bin]]
name = "dmux-gui"
path = "src/bin/dmux-gui.rs"

[dependencies]
ddc-hi = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# GPUI, modern layout: `gpui` and `gpui_platform` are separate crates. BOTH
# features we need hang off `gpui_platform`, not off `gpui`:
#   * font-kit        -> real text on macOS. `font-kit` sits in gpui's default
#                        feature set, so `default-features = false` silently
#                        drops it, and the macOS backend then substitutes
#                        `NoopTextSystem`: layout, styling and font metrics all
#                        answer normally and not one glyph is ever painted.
#                        Zed hit the same trap (zed-industries/zed#59241).
#   * runtime_shaders -> compile Metal shaders at runtime. Without it the build
#                        shells out to `xcrun -sdk macosx metal`, which only
#                        ships with full Xcode; with it, Command Line Tools are
#                        enough. Costs a little startup time on first run.
# Versions are pinned with `=` on purpose: gpui's minor number comes from Zed's
# release tag and carries no compatibility meaning.
gpui = { package = "gpui-unofficial", version = "=1.24.1-pre", default-features = false, optional = true }
gpui_platform = { package = "gpui-platform-gpui-unofficial", version = "=1.24.1-pre", default-features = false, features = [
    "font-kit",
    "runtime_shaders",
], optional = true }

# Tray icon. GPUI ships no tray API, so a resident switcher brings its own.
# Not optional: the tray lives in the library (src/tray.rs), not in the GUI
# binary, so the CLI build links it too. It is small and pulls no GUI stack.
tray-icon = "0.26"
# How `tray.rs` hands status-item clicks to the UI thread. Awaiting it beats
# polling on a timer. Not optional, for the same reason `tray-icon` is not:
# the tray lives in the library, so the CLI build needs it too.
async-channel = "2.5"

[features]
default = []
# `cargo build --features gui` builds dmux-gui. The GUI pulls in GPUI, whose
# dependency tree is large; the CLI and DDC helper stay usable without it.
gui = ["dep:gpui", "dep:gpui_platform"]

[profile.release]
lto = "thin"
strip = true

[target."cfg(windows)".build-dependencies]
winresource = "0.1.31"
